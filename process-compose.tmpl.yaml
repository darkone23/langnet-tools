# ${LANGNET_TOOLS_HEADER}
version: "0.5"

environment:
  - "GLOBAL_ENV_VAR=1"
  - "LANGNET_RATE_LIMIT_MODE=observe"
  - "LANGNET_ANON_SESSION_COOKIE=ln_anon"

log_location: ${LANGNET_TOOLS_DIR}/process-compose.log
log_level: debug

# Log rotation for process-compose output is managed by the logrotate_process_compose
# helper below. It uses ../process-compose.logrotate via nix-shell and stores
# logrotate state under ../tmp/.

processes:
  diogenes:
    command: "bash --login -c 'just -f ${LANGNET_TOOLS_DIR}/justfile diogenes-server'"
    availability:
      restart: "always"
    environment:
      - "PHI_DIR=${LANGNET_TOOLS_DIR}/diogenes/Classics-Data/phi-latin"
      - "TLG_DIR=${LANGNET_TOOLS_DIR}/diogenes/Classics-Data/tlg_e"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/"
        port: 8888

  # Warm langnet server (HOL-199 S4a / HOL-204): uncommented for the staged
  # rollout. Provider keys come from the SRE-managed env file referenced
  # below — never inline secrets in this template (house rule). A missing
  # env file is non-fatal: the slot boots keyless and populate/auto
  # translation paths degrade to cache mode (accepted design:
  # langnet-cli docs/plans/active/infra/warm-cli-server-http-json.md).
  langnet_cli:
    command: "just -f ${LANGNET_TOOLS_DIR}/justfile langnet-cli-server"
    availability:
      restart: "always"
    env_file: "${LANGNET_TOOLS_DIR}/../.config/langnet/server.env"
    environment:
      - "LANGNET_LOG_LEVEL=INFO"
      - "LANGNET_CACHE_ENABLED=true"
    depends_on:
      diogenes:
        condition: process_healthy
      sanskrit_heritage:
        condition: process_healthy
    readiness_probe:
      initial_delay_seconds: 20
      timeout_seconds: 5
      failure_threshold: 5
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/api/health"
        port: 8000
      period_seconds: 10
      success_threshold: 1

  # zombie_reaper retired (HOL-216): the fork-per-connection zombie leak it
  # papered over is fixed at the source by darkone23/diogenes#1 (SIGCHLD
  # reap in the forking server), verified in prod by the deploy workflow's
  # zombie-leak probe (fatal-on-zombies since this change). The hourly
  # SIGTERM-blip class it caused is gone with it. Re-add only on a
  # demonstrated leak regression.

  logrotate_process_compose:
    command: "just -f ${LANGNET_TOOLS_DIR}/justfile logrotate-loop"
    availability:
      restart: "always"
    environment:
      - "LANGNET_LOGROTATE_INTERVAL_SECONDS=3600"

  langnet_web:
    command: "cd ${LANGNET_TOOLS_DIR}/langnet-cli && devenv shell -- bash -c 'cd webapp && just preview-logs'"
    availability:
      restart: "always"
    # Warm-server transport (HOL-204 runbook step 4): API surfaces POST to the
    # langnet_cli slot on loopback instead of spawning a CLI subprocess per
    # request; any server failure (connect/non-200/timeout/malformed) falls
    # back to the subprocess path per request. Rollback = remove this line and
    # redeploy. Loopback-only, same host as the slot.
    environment:
      - "LANGNET_SERVER_URL=http://127.0.0.1:8000"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/api/health"
        port: 43210

  langnet_web_caddy:
    command: "cd ${LANGNET_TOOLS_DIR}/langnet-cli && devenv shell -- bash -c 'cd webapp && sudo -n just caddy-proxy'"
    availability:
      restart: "always"
    depends_on:
      langnet_web:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/api/health"
        port: 80

  sanskrit_heritage:
    command: "cd ${LANGNET_TOOLS_DIR}/sanskrit-heritage && devenv shell heritage-cgi"
    shutdown:
      command: "pkill httpd"
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/"
        port: 48080
