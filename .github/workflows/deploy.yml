name: deploy

# langnet prod deploy (HOL-134, plan rev 3 Phase 3): merge to main = deploy.
# Runs on the dedicated self-hosted runner on hetzner-edge, registered to this
# repo (same boundary-first pattern as the chipnet sync-apply runner: the
# runner lives inside the tailnet, no ephemeral cloud worker ever joins).
#
# The runner reaches orion ONLY over tailscale ssh (identity-based, no key
# material; Tailscale ACL + ssh rule gate paperclip+edge -> orion:22, nothing
# broader — scope verified before the first run).
#
# Deploy steps live in the repo justfile (`just deploy <sha>`) so this
# workflow stays thin. ROLLBACK: re-run `just deploy <previous-sha>` on orion
# — same recipe, previous revision.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, langnet-edge]
    timeout-minutes: 15
    steps:
      - name: Refuse runs that are not on main
        # workflow_dispatch can be sent from any ref; a diverged workspace must
        # never deploy. Push runs are always main (trigger filter).
        run: |
          echo "deploy: event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            exit 0
          fi
          echo "::error::deploy runs only from main — push to main, or workflow_dispatch targeting main (got ref '${GITHUB_REF_NAME}')"
          exit 1

      - name: Preflight — prove the deploy channel (tailscale ssh to orion)
        # Retry window (board direction, 2026-09-13): a cold tailscaled on
        # either end can make the first attempt time out; 3 attempts x 5s
        # keeps it fail-fast but immune to a slow path setup.
        run: |
          ok=0
          for i in 1 2 3; do
            if ssh -o BatchMode=yes -o ConnectTimeout=10 langnet@orion.elf-lizard.ts.net 'echo deploy-channel-ok'; then
              ok=1
              break
            fi
            echo "preflight attempt $i failed; retrying in 5s"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::tailscale ssh channel to orion never came up"; exit 1; }

      - name: Self-heal the prod fetch path (origin -> https)
        # HOL-202: the prod checkout's origin must be the public https URL.
        # The repo is public, so fetches need no key material on the box; an
        # ssh:// origin makes every deploy depend on a deploy key surviving
        # there, and it drifted before (git fetch died with
        # "Permission denied (publickey)" before the recipe could run).
        # Idempotent: a no-op when origin already matches. This step is the
        # bootstrap — it runs from the merged workflow before the on-box
        # recipe (which may predate the self-heal) fetches.
        run: |
          ssh -o BatchMode=yes langnet@orion.elf-lizard.ts.net \
            "git -C ~/langnet-tools remote set-url origin https://github.com/darkone23/langnet-tools"
          ssh -o BatchMode=yes langnet@orion.elf-lizard.ts.net \
            "git -C ~/langnet-tools remote get-url origin"

      - name: Deploy the merged revision (justfile recipe on orion)
        run: |
          ssh -o BatchMode=yes langnet@orion.elf-lizard.ts.net \
            "cd ~/langnet-tools && just deploy '${GITHUB_SHA}'"

      - name: Smoke — public health through Caddy
        # Retry window per board direction (2026-09-13): retry for up to 60s
        # at a 2s interval, so the public smoke never races Caddy's bind after
        # compose-restart (first real run: loopback health green, public smoke
        # HTTP 521 one second later, 200 confirmed minutes later — the deploy
        # restarts orion's langnet_web_caddy with the graph).
        run: |
          ok=0
          deadline=$(( $(date +%s) + 60 ))
          attempt=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            if curl -fsS --max-time 15 https://project-orion.net/api/health; then
              ok=1
              break
            fi
            echo "smoke attempt $attempt failed; retrying in 2s (60s window)"
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::public /api/health never came up through Caddy (60s window exhausted)"; exit 1; }
